version: '3.9'

# Deploiement DISTANT (2026-07-30) : ai_service tourne sur un VPS separe du
# backend (169.58.100.82, plus de RAM libre que le VPS partage 178.238.230.82
# qui heberge deja Postgres/Redis/RabbitMQ/Elasticsearch/stream_app). Les deux
# VPS sont relies par un tunnel WireGuard prive :
#   - VPS backend  = peer WireGuard 10.10.0.1 (postgres/redis/rabbitmq exposes
#     UNIQUEMENT sur cette IP privee, jamais publiquement — voir docker-compose.prod.yml
#     de stream_backend, bloc `ports: ["10.10.0.1:PORT:PORT"]` sur ces 3 services).
#   - VPS ai_service = peer WireGuard 10.10.0.2 (ce serveur).
#
# Consequence : pas de reseau Docker partage avec le backend (impossible,
# serveurs distincts). Les URLs Postgres/Redis/RabbitMQ dans .env.ai pointent
# sur 10.10.0.1 au lieu des hostnames Docker "postgres"/"redis"/"rabbitmq".
#
# Pour un deploiement colocalise (meme serveur que stream_backend, reseau
# Docker partage), voir docker-compose.colocated.yml — conserve pour reference
# si l'architecture change a nouveau.

services:
  ai_service:
    build: .
    container_name: gofolyx_ai_service
    restart: unless-stopped
    env_file:
      - .env.ai
    volumes:
      - ./models:/app/models:ro
    # Bind sur l'IP WireGuard uniquement (10.10.0.2 = ce serveur cote tunnel),
    # jamais 0.0.0.0 — meme principe de securite que postgres/redis/rabbitmq
    # cote VPS backend. Le service n'a pas besoin d'etre joignable depuis
    # l'internet public : seul le VPS backend (10.10.0.1) doit pouvoir
    # l'appeler, une fois l'integration cablee cote stream_backend.
    ports:
      - "10.10.0.2:8100:8100"

  ai_celery_worker:
    build: .
    container_name: gofolyx_ai_celery_worker
    restart: unless-stopped
    env_file:
      - .env.ai
    volumes:
      - ./models:/app/models:ro
    # concurrency=1 volontaire — un seul modele lourd charge a la fois
    # (model_manager), meme raisonnement qu'en colocalise meme si ce VPS a
    # plus de marge RAM : garder une seule regle simple plutot que deux
    # profils de concurrence a maintenir (cf. ARCHITECTURE_IA.md section 4).
    command: celery -A app.workers.celery_app worker -Q ai --concurrency=1 --loglevel=info
